<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Criar usuário · Gestão de Serviços</title>
<style>
body{font-family:system-ui,sans-serif;background:#f2f4f9;color:#14213d;margin:0;padding:24px}
form{max-width:420px;margin:24px auto;background:#fff;border-radius:12px;padding:24px;box-shadow:0 4px 20px rgba(0,0,0,.08)}
h1{font-size:20px;margin:0 0 4px}p{color:#5a6785;font-size:14px;margin:0 0 12px}
label{display:block;font-size:13px;font-weight:600;margin:12px 0 4px}
input{width:100%;box-sizing:border-box;padding:10px;border:1px solid #dce1ee;border-radius:8px;font:inherit}
button{margin-top:16px;width:100%;padding:12px;border:0;border-radius:8px;background:#12285a;color:#fff;font:600 15px system-ui;cursor:pointer}
#msg{margin-top:12px;font-size:14px;min-height:20px}
</style></head><body>
<form id="f"><h1>Criar usuário ou trocar senha</h1>
<p>Use a chave de administrador (ADMIN_KEY) definida no Netlify. Se o e-mail já existir, a senha é trocada.</p>
<label>Chave de administrador</label><input id="k" type="password" required>
<label>Nome</label><input id="n" required>
<label>E-mail</label><input id="e" type="email" required>
<label>Senha (mínimo 6 caracteres)</label><input id="p" type="text" minlength="6" required>
<button>Salvar usuário</button><div id="msg" role="status"></div></form>
<script>
document.getElementById('f').addEventListener('submit',async ev=>{
  ev.preventDefault();const m=document.getElementById('msg');m.textContent='Salvando…';
  try{
    const r=await fetch('/.netlify/functions/api',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({action:'createUser',adminKey:k.value,nome:n.value,email:e.value,password:p.value})});
    if(r.ok){m.style.color='#1d6b4a';m.textContent='Usuário salvo. Já pode entrar com esse e-mail e senha.';n.value=e.value=p.value=''}
    else{m.style.color='#b3261e';m.textContent=r.status===403?'Chave de administrador incorreta.':r.status===400?'Confira nome, e-mail e senha (mín. 6).':'Erro no servidor. Confira as variáveis no Netlify.'}
  }catch(x){m.style.color='#b3261e';m.textContent='Sem conexão.'}
});
</script></body></html>
