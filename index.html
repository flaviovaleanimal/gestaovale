<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gestão de Serviços</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: barra lateral de módulos + área de trabalho com subabas; tabelas rolam dentro do próprio contêiner */
:root{
  --side:#0b1a3f; --head:#12285a; --sb:#b5bfd8; --bar:#2f5fc4;
  --bg:#f2f4f9; --surface:#ffffff; --ink:#14213d; --muted:#5a6785; --line:#dce1ee;
  --navy:#12285a; --navy-ink:#ffffff; --navy-soft:#e6ebf7;
  --in:#1d6b4a; --in-bg:#e2f3ea; --out:#a4401f; --out-bg:#fbe9e1;
  --warn:#9a5200; --warn-bg:#fdf0d8; --danger:#b3261e;
  --paper:#ffffff; --paper-ink:#1b2438; --paper-line:#cfd5e3;
  --f-display:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif;
  --f-body:'IBM Plex Sans','Segoe UI',system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --side:#08112a; --head:#0f2250; --sb:#3a4a72; --bar:#7ba3ff;
  --bg:#0c1322; --surface:#141d33; --ink:#e8ecf6; --muted:#9aa6c2; --line:#26314d;
  --navy:#1d3677; --navy-ink:#ffffff; --navy-soft:#1b2745;
  --in:#5cc496; --in-bg:#12332a; --out:#f0966f; --out-bg:#3a2119;
  --warn:#f2b45c; --warn-bg:#3a2b10; --danger:#ff8a80; color-scheme:dark}}
:root[data-theme="dark"]{
  --side:#08112a; --head:#0f2250; --sb:#3a4a72; --bar:#7ba3ff;
  --bg:#0c1322; --surface:#141d33; --ink:#e8ecf6; --muted:#9aa6c2; --line:#26314d;
  --navy:#1d3677; --navy-ink:#ffffff; --navy-soft:#1b2745;
  --in:#5cc496; --in-bg:#12332a; --out:#f0966f; --out-bg:#3a2119;
  --warn:#f2b45c; --warn-bg:#3a2b10; --danger:#ff8a80; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.45;
  overflow:hidden}
html,body{height:100%}
*{scrollbar-width:thin;scrollbar-color:var(--sb) transparent}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--sb);border-radius:99px;border:2px solid transparent;background-clip:content-box}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
h2{font-size:20px} h3{font-size:16px}
h2,h3,.ht b{text-transform:uppercase;letter-spacing:.03em}
button,input,select,textarea{font:inherit;color:inherit}
.app{display:grid;grid-template-columns:var(--sw,252px) minmax(0,1fr);height:100%}
.side{background:var(--side);color:#fff;overflow-y:auto;overflow-x:hidden;min-height:0;display:flex;flex-direction:column;gap:2px;padding:14px 10px;padding-left:max(10px,env(safe-area-inset-left,0px))}
.brand{display:flex;align-items:center;gap:10px;padding:2px 6px 16px;font-family:var(--f-display);font-weight:700;line-height:1.1;white-space:nowrap}
.logo{flex:none;width:36px;height:36px;border-radius:8px;background:#fff;color:var(--side);display:grid;place-items:center;font-size:14px}
.brand small{display:block;font-family:var(--f-body);font-weight:400;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;opacity:.65;margin-bottom:2px}
.ni{display:flex;align-items:center;gap:10px;width:100%;background:none;border:0;color:inherit;padding:9px 10px;padding-left:calc(10px + var(--d,0) * 14px);border-radius:7px;cursor:pointer;text-align:left;font-size:14px;opacity:.82;white-space:nowrap}
.ni:hover{background:rgba(255,255,255,.1);opacity:1}
.ni.act{opacity:1;font-weight:600}
.ni.cur{background:#fff;color:var(--side);opacity:1;font-weight:600}
.ni.dis{opacity:.45;cursor:default}
.ni.dis:hover{background:none}
.ni .lbl{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
.ni em{font-style:normal;font-size:10px;letter-spacing:.06em;text-transform:uppercase;border:1px solid rgba(255,255,255,.4);border-radius:99px;padding:1px 6px}
.ic{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.chev{width:16px;height:16px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;transition:transform .2s}
.chev.o{transform:rotate(90deg)}
.dot{width:6px;height:6px;border-radius:50%;background:currentColor;flex:none;margin:0 7px}
.kids{display:grid;grid-template-rows:0fr;transition:grid-template-rows .2s}
.kids.o{grid-template-rows:1fr}
.kin{overflow:hidden;min-height:0;display:flex;flex-direction:column;gap:2px}
.kids:not(.o) .kin{visibility:hidden}
.side.mini .lbl,.side.mini .chev,.side.mini .brand-t,.side.mini .kids .kids{display:none}
.side.mini .ni{justify-content:center;padding:10px 0}
.side.mini .brand{justify-content:center;padding-inline:0}
.col{display:grid;grid-template-rows:auto minmax(0,1fr);min-width:0;min-height:0}
.hdr{background:var(--head);color:#fff;display:flex;align-items:center;gap:12px;padding:8px max(16px,env(safe-area-inset-right,0px)) 8px 10px;min-height:56px}
.hb{flex:none;width:40px;height:40px;border-radius:8px;border:0;background:rgba(255,255,255,.12);color:#fff;cursor:pointer;display:grid;place-items:center}
.hb:hover{background:rgba(255,255,255,.22)}
.ht{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.2}
.ht .hs{font-size:11px;opacity:.75;letter-spacing:.06em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ht b{font-family:var(--f-display);font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hu{flex:none;background:rgba(255,255,255,.16);border-radius:99px;padding:5px 12px;font-weight:600;font-size:13px}
.content{overflow:auto;min-height:0;padding:20px max(24px,env(safe-area-inset-right,0px)) 28px 24px;display:flex;flex-direction:column;gap:16px}
.content>*{flex:none;width:100%}
.scrim{display:none}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;min-width:0}
.card-h{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.stat .n{font-family:var(--f-display);font-weight:700;font-size:34px;line-height:1;font-variant-numeric:tabular-nums}
.stat .l{color:var(--muted);margin-top:6px}
.stat.alert .n{color:var(--warn)}
.two{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:12px}
.tw{overflow-x:auto}
.small table{font-size:12.5px}
.small th{font-size:10px}
.small td{padding:8px 10px}
.small .pill{font-size:11px}
table{border-collapse:collapse;width:100%;min-width:560px}
th{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);text-align:left;font-weight:600;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
th.num{text-align:right}
tfoot td{font-weight:600;background:var(--navy-soft);border-bottom:0}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:7px 12px;cursor:pointer;font-weight:500}
.btn:hover{border-color:var(--head)}
.btn.pri{background:var(--navy);color:var(--navy-ink);border-color:var(--navy)}
.btn.dng{color:var(--danger)}
.btn.sm{padding:4px 9px;font-size:12.5px}
:focus-visible{outline:2px solid var(--head);outline-offset:2px}
.side :focus-visible,.hdr :focus-visible{outline-color:#fff}
.acts{display:flex;gap:6px;flex-wrap:wrap}
.pill{display:inline-block;border-radius:99px;padding:2px 9px;font-size:12px;font-weight:600;white-space:nowrap}
.pill.in{background:var(--in-bg);color:var(--in)} .pill.out{background:var(--out-bg);color:var(--out)}
.pill.warn{background:var(--warn-bg);color:var(--warn)} .pill.ok{background:var(--navy-soft);color:var(--ink)}
.in-t{color:var(--in)} .out-t{color:var(--out)}
.muted{color:var(--muted)}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px;align-items:start}
.fld{display:flex;flex-direction:column;gap:4px;min-width:0}
.fld.wide{grid-column:1/-1}
.fld label{font-size:12px;font-weight:600;color:var(--muted)}
.fld input,.fld select,.fld textarea{border:1px solid var(--line);background:var(--bg);border-radius:6px;padding:8px 10px;width:100%;min-width:0}
.fld .hint{font-size:12.5px;color:var(--in);font-weight:500}
.fld .ro{background:var(--navy-soft);border-radius:6px;padding:8px 10px;min-height:37px}
.err{background:var(--out-bg);color:var(--out);border-radius:6px;padding:8px 12px;margin-bottom:12px;font-weight:500}
.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
.filters .fld{min-width:150px}
.farm-row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 4px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.farm-row:last-child{border:0}
.farm-row b{font-family:var(--f-display);font-size:16px}
.tog{background:none;border:0;cursor:pointer;font-weight:600;padding:0;text-align:left}
.loc td{background:var(--navy-soft);padding:6px 10px 6px 34px;font-size:13px;border-bottom:1px solid var(--line)}
.banner.ok{background:var(--in-bg);color:var(--in)}
.banner{background:var(--warn-bg);color:var(--warn);border-radius:8px;padding:8px 12px;display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap;font-size:13px}
.empty{padding:28px 12px;text-align:center;color:var(--muted)}
.ov{position:fixed;inset:0;background:rgba(8,14,30,.55);display:flex;align-items:flex-start;justify-content:center;padding:max(16px,env(safe-area-inset-top,0px)) 16px 16px;overflow:auto;z-index:50}
.modal{background:var(--surface);border-radius:12px;width:100%;max-width:560px;padding:20px;margin:auto 0}
.modal.big{max-width:760px}
.line{border:1px solid var(--line);border-radius:10px;padding:16px;margin-top:16px}
.line-h{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.plus{display:flex;justify-content:center;margin-top:14px}
.plusbtn{width:40px;height:40px;border-radius:50%;border:1px solid var(--head);background:var(--surface);color:var(--head);font-size:26px;line-height:1;cursor:pointer;display:grid;place-items:center;padding:0 0 3px}
.plusbtn:hover{background:var(--head);color:#fff}
.bars{display:grid;gap:6px}
.bar-row{display:grid;grid-template-columns:minmax(90px,190px) minmax(0,1fr) 64px;gap:12px;align-items:center}
.bar-name{font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar-track{position:relative;height:24px;border-left:1px solid var(--muted);border-right:1px solid var(--line);background-image:linear-gradient(to right,var(--line) 1px,transparent 1px);background-size:25% 100%}
.bar{position:absolute;left:0;top:3px;bottom:3px;min-width:2px;background:var(--bar);border-radius:0 4px 4px 0}
.bar-row:hover .bar{filter:brightness(1.18)}
.bar-val{font-size:13px;font-weight:600;font-variant-numeric:tabular-nums;text-align:right}
.bar-row.axis{margin-top:2px}
.ticks{position:relative;height:16px;font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.ticks span{position:absolute;top:0;transform:translateX(-50%)}
.ticks span:first-child{transform:none}
.ticks span:last-child{transform:translateX(-100%)}
@media(max-width:640px){.bar-row{grid-template-columns:96px minmax(0,1fr) 48px;gap:8px}}
.okbar{background:var(--in-bg);color:var(--in);border-radius:6px;padding:8px 12px;margin-bottom:12px;font-weight:500}
.chk{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1px solid var(--line);border-radius:8px;cursor:pointer}
.chk input{margin-top:3px;width:16px;height:16px;flex:none}
.chk small{color:var(--muted)}
.modal.xl{max-width:1040px;padding:28px}
.modal.xl .form{grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px 20px}
.modal.xl .fld input,.modal.xl .fld select,.modal.xl .fld textarea{padding:11px 12px;font-size:15px}
.modal.xl h3{font-size:20px;margin-bottom:20px}
.modal h3{margin-bottom:14px}
.mf{display:flex;justify-content:flex-end;gap:8px;margin-top:16px;flex-wrap:wrap}
.paper{background:var(--paper);color:var(--paper-ink);border:1px solid var(--paper-line);border-radius:4px;overflow:hidden;font-size:13px}
.paper-h{background:#12285a;color:#fff;padding:14px 16px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
.paper-h b{font-family:var(--f-display);font-size:18px}
.paper-h span{font-size:12px;opacity:.85}
.paper-b{padding:14px 16px;overflow-x:auto}
.paper table{min-width:520px}
.paper th{background:#12285a;color:#fff;border-bottom:0}
.paper td{border-bottom:1px solid var(--paper-line)}
.paper tfoot td{background:#e6ebf7;color:#12285a}
.paper .loc-l{font-size:12px;color:#44506e;padding:2px 0 2px 12px}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:max(20px,env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;z-index:60;font-weight:500;max-width:90vw}
@media(max-width:820px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:fixed;z-index:40;left:0;top:0;bottom:0;width:272px;transform:translateX(-104%);padding-top:max(14px,env(safe-area-inset-top,0px))}
  .app.drawer .side{transform:none;box-shadow:6px 0 24px rgba(0,0,0,.35)}
  .app.drawer .scrim{display:block;position:fixed;inset:0;background:rgba(8,14,30,.5);z-index:30}
  .two{grid-template-columns:minmax(0,1fr)}
  .content{padding-left:max(16px,env(safe-area-inset-left,0px))}
}
@media(max-width:640px){
  #app table{min-width:0}
  #app thead{display:none}
  #app table,#app tbody,#app tfoot,#app tr{display:block}
  #app tr{border:1px solid var(--line);border-radius:8px;margin-bottom:10px;padding:4px 12px;background:var(--surface)}
  #app td{display:flex;justify-content:space-between;align-items:center;gap:12px;text-align:right;border:0;padding:6px 0}
  #app td[data-l]::before{content:attr(data-l);font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);font-weight:600;text-align:left;flex:none}
  #app tr.loc{background:none;border:0;padding:0;margin:-6px 0 10px}
  #app .loc td{display:block;text-align:left;padding:6px 12px;background:var(--navy-soft);border-radius:6px}
  #app tfoot tr{background:var(--navy-soft)}
  #app tfoot td{background:none}
  .modal{padding:16px}
}
@media(prefers-reduced-motion:reduce){.kids,.chev{transition:none}}
@media(prefers-reduced-motion:no-preference){.ov{animation:fd .15s ease-out}@keyframes fd{from{opacity:0}}}

@media print{
  @page{size:A4;margin:12mm}
  html,body{height:auto!important;overflow:visible!important;background:#fff!important}
  #shell,#toast{display:none!important}
  .ov{position:static!important;display:block!important;background:none!important;padding:0!important;overflow:visible!important;animation:none!important}
  .modal{max-width:none!important;padding:0!important;margin:0!important;background:none!important;border-radius:0!important}
  .modal>h3,.modal>.mf,.modal>p{display:none!important}
  .paper{border:0!important}
  .paper-b{overflow:visible!important;padding:12px 0!important}
  .paper table{min-width:0!important}
  .paper-h,.paper th,.paper tfoot td{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .paper tr{break-inside:avoid}
}
</style>
</head><body>

<div class="app" id="shell">
  <aside class="side" id="side" aria-label="Menu principal"></aside>
  <div class="scrim" data-a="scrim"></div>
  <div class="col"><header class="hdr" id="hdr"></header><main class="content" id="app"></main></div>
</div>
<div id="toast" hidden></div>
<div id="modal-root"></div>

<script src="cloud.js"></script>
<script>
const KEY='gs-semen-v1';
const BREEDS=['Angus','Brangus','Charolês','Embrião','Girolando','Jersey','Nelore CEIP','Nelore PO','Senepol','Wagyu'];
const INDS=['Novilhas 14 Meses','Novilhas 24 Meses','Vacas Comum','Vacas Acasalamento','Não Utilizar'];
const CAPS=[12,20,34,47];
const UFS=['AC','AL','AP','AM','BA','CE','DF','ES','GO','MA','MT','MS','MG','PA','PB','PR','PE','PI','RJ','RN','RS','RO','RR','SC','SP','SE','TO'];
const LOW=20;

const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const fmt=n=>Number(n).toLocaleString('pt-BR');
const money=n=>Number(n||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const dt=s=>s?s.split('-').reverse().join('/'):'';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function seed(){
  const m=(date,type,b,ind,farm,tank,qty,note='')=>({date,type,b,ind,farm,tank,qty,note});
  const movs=[
    m('2026-09-02','entrada','b1','Vacas Comum','f1','t1',70,'Compra lote setembro'),
    m('2026-09-02','entrada','b1','Vacas Comum','f1','t2',70),
    m('2026-09-20','saida','b1','Vacas Comum','f1','t2',20,'IATF lote 3'),
    m('2026-09-05','entrada','b2','Novilhas 14 Meses','f1','t1',100),
    m('2026-10-01','saida','b2','Novilhas 14 Meses','f1','t1',30,'IATF novilhas'),
    m('2026-09-12','entrada','b3','Novilhas 24 Meses','f1','t3',60),
    m('2026-09-10','entrada','b4','Vacas Acasalamento','f2','t3',90),
    m('2026-10-14','saida','b4','Vacas Acasalamento','f2','t3',10,'Acasalamento piquete 2'),
    m('2026-09-18','entrada','b1','Novilhas 24 Meses','f2','t1',40),
    m('2026-10-22','entrada','b5','Vacas Comum','f2','t2',30,'Embriões transferência')
  ].map((x,i)=>({id:'m'+i,...x}));
  return {seq:100,
    farms:[{id:'f1',name:'Fazenda Pontal',owner:'Antônio Vale',city:'Uberaba',state:'MG',matrices:850},{id:'f2',name:'Fazenda Três Marias',owner:'Marta Vale',city:'Campo Grande',state:'MS',matrices:1200}],
    breeders:[{id:'b1',name:'CONGO CAMPARINO',breed:'Nelore PO'},{id:'b2',name:'BANDEIRANTE TE',breed:'Angus'},
      {id:'b3',name:'JAGUAR FIV',breed:'Brangus'},{id:'b4',name:'MESTRE DO VALE',breed:'Senepol'},{id:'b5',name:'LUA NOVA',breed:'Embrião'}],
    tanks:[{id:'t1',name:'Felicidade',cap:34,max:1500},{id:'t2',name:'Gabriela',cap:20,max:800},{id:'t3',name:'Esperança',cap:47,max:2200}],
    movs,
    meas:[
      {id:'n1',tank:'t1',kind:'medicao',date:'2026-10-28',level:24,liters:0,total:0,note:''},
      {id:'n2',tank:'t1',kind:'abastecimento',date:'2026-10-20',level:28,liters:12,total:168,note:'Fornecedor local'},
      {id:'n3',tank:'t2',kind:'medicao',date:'2026-11-02',level:18,liters:0,total:0,note:'Programar abastecimento'},
      {id:'n4',tank:'t3',kind:'medicao',date:'2026-11-01',level:31,liters:0,total:0,note:''}]};
}
/* ---------- armazenamento: banco compartilhado (db) ou, sem ele, este navegador ---------- */
const emptyS=()=>({farms:[],breeders:[],tanks:[],movs:[],meas:[],products:[],pmovs:[],lotes:[],fichas:[]});
let S=emptyS();
let DB=null,dbState='conectando',slowT=null,busy=false,q=[],needRender=false;
const synced={farms:{},breeders:{},tanks:{},movs:{},meas:{},products:{},pmovs:{},lotes:{},fichas:{}},lastSnap={},held={},got={};
const nid=p=>p+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const loadLocal=()=>{try{const r=localStorage.getItem(KEY);return r?JSON.parse(r):null}catch(e){return null}};
function bannerTxt(){return {ok:'Conectado à nuvem: tudo o que for lançado fica salvo e aparece para todos os usuários (atualiza a cada poucos segundos).',
  conectando:'Conectando ao banco de dados…',lento:'Não foi possível alcançar o banco de dados agora. Os dados podem estar desatualizados.',
  erro:'O banco de dados recusou o acesso. Saia e entre de novo.',local:'Modo de teste: os dados ficam salvos só neste navegador.'}[dbState]}
function save(){
  if(!DB){
    if(dbState==='conectando'){toast('Aguarde: conectando ao banco de dados…');return}
    try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}
    return}
  for(const c in synced){
    const cur={};S[c].forEach(x=>{cur[x.id]=JSON.stringify(x)});
    for(const id in cur)if(synced[c][id]!==cur[id])q.push({op:'set',c,id,data:JSON.parse(cur[id])});
    for(const id in synced[c])if(!(id in cur))q.push({op:'del',c,id});
    synced[c]=cur;
  }
  pump();
}
async function pump(){
  if(busy)return;busy=true;let fail=null;
  while(q.length&&!fail){
    const o=q.shift();
    for(let t=0;t<2;t++){
      try{const ref=DB.collection(o.c).doc(o.id);if(o.op==='set')await ref.set(o.data);else await ref.delete();fail=null;break}
      catch(e){fail=e||{};if(fail.code!=='unavailable')break;await new Promise(r=>setTimeout(r,400+Math.random()*600))}
    }
  }
  busy=false;
  if(fail){q=[];Object.keys(lastSnap).forEach(c=>applyCol(c,lastSnap[c]));
    toast(fail.code==='invalid_argument'?'Sem permissão para gravar. Saia e entre de novo.':'Não foi possível salvar agora. Tente de novo.')}
  Object.keys(held).forEach(c=>{applyCol(c,held[c]);delete held[c]});
  softRender();
}
function applyCol(c,arr){S[c]=arr;synced[c]={};arr.forEach(x=>{synced[c][x.id]=JSON.stringify(x)})}
function onSnap(c,snap){
  const arr=snap.docs.map(x=>JSON.parse(JSON.stringify(x.data())));
  lastSnap[c]=arr;
  if(!snap.metadata.fromCache){got[c]=1;if(Object.keys(got).length===Object.keys(synced).length){dbState='ok';clearTimeout(slowT)}}
  if(busy||q.length){held[c]=arr;return}
  applyCol(c,arr);softRender();
}
function softRender(){
  const a=document.activeElement;
  if(a&&a.closest&&a.closest('#modal-root')&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)){needRender=true;return}
  needRender=false;render();
}
document.addEventListener('focusout',()=>{if(needRender)setTimeout(()=>{const a=document.activeElement;if(!(a&&a.closest&&a.closest('#modal-root')))softRender()},60)});
async function init(){
  try{if(window.GS_CLOUD&&GS_CLOUD.enabled)DB=await GS_CLOUD.connect();else if(window.claude&&window.claude.use)DB=await window.claude.use('db')}catch(e){DB=null}
  if(!DB){dbState='local';const l=loadLocal();if(l)S=Object.assign(emptyS(),l);render();return}
  slowT=setTimeout(()=>{if(dbState!=='ok'){dbState='lento';render()}},10000);
  Object.keys(synced).forEach(c=>DB.collection(c).onSnapshot(sn=>onSnap(c,sn),e=>{dbState=(e&&e.code==='unavailable')?'lento':'erro';render()}));
}

const B=id=>S.breeders.find(x=>x.id===id)||{name:'?',breed:''};
const F=id=>S.farms.find(x=>x.id===id)||{name:'?'};
const T=id=>S.tanks.find(x=>x.id===id)||{name:'?'};
const sg=m=>m.type==='entrada'?m.qty:-m.qty;
const tankStock=id=>S.movs.filter(m=>m.tank===id).reduce((a,m)=>a+sg(m),0);
const farmTotal=id=>S.movs.filter(m=>m.farm===id).reduce((a,m)=>a+sg(m),0);
const breederBal=id=>S.movs.filter(m=>m.b===id).reduce((a,m)=>a+sg(m),0);
const tankLast=id=>S.meas.filter(x=>x.tank===id).sort((a,b)=>b.date.localeCompare(a.date)||0)[0];
function items(fid,flt={}){
  const map={};
  S.movs.filter(m=>m.farm===fid).forEach(m=>{
    const k=m.b+'|'+m.ind;
    const o=map[k]||(map[k]={key:k,b:m.b,ind:m.ind,ent:0,sai:0,tanks:{}});
    if(m.type==='entrada')o.ent+=m.qty;else o.sai+=m.qty;
    o.tanks[m.tank]=(o.tanks[m.tank]||0)+sg(m);
  });
  return Object.values(map).map(o=>({...o,bal:o.ent-o.sai,name:B(o.b).name,breed:B(o.b).breed}))
    .filter(o=>(!flt.breed||o.breed===flt.breed)&&(!flt.ind||o.ind===flt.ind)&&(flt.zero||o.bal>0))
    .sort((a,b)=>a.name.localeCompare(b.name));
}
function check(movs){
  const g={};
  movs.forEach(m=>{const k=[m.farm,m.b,m.ind,m.tank].join('|');g[k]=(g[k]||0)+sg(m)});
  for(const k in g)if(g[k]<0){const [f,b,i,t]=k.split('|');
    return `Esta alteração deixaria o saldo negativo (${B(b).name}, ${F(f).name}, botijão ${T(t).name}). Ajuste a quantidade ou revise as saídas.`}
  return '';
}

  ${list.map(m=>`<tr><td>${dt(m.date)}</td><td>${esc(B(m.b).name)}</td><td>${esc(F(m.farm).name)}</td><td>${esc(T(m.tank).name)}</td><td>${pill(m)}</td>${qty(m,' doses')}</tr>`).join('')}

  const tks=it?Object.entries(it.tanks).filter(([,q])=>q>0):[];
  const av=it&&r.tank?(it.tanks[r.tank]||0):null;
  return `<div class="line"><div class="line-h"><b>Sêmen ${i+1}</b>${n>1?`<button type="button" class="btn sm dng" data-a="delSRow" data-v="${i}">Remover</button>`:''}</div>
   <div class="form">
   ${fldHtml('Reprodutor / Sêmen',`<select data-srow="${i}.item" data-r="1"${farm?'':' disabled'}>${opts(its.map(o=>[o.b,o.name]),r.item,farm?(its.length?'Selecione…':'Sem sêmen com saldo'):'Escolha a fazenda')}</select>
      ${it?`<span class="hint">Estoque disponível na ${esc(F(farm).name)}: ${fmt(it.bal)} doses.</span>`:''}`)}
   ${fldHtml('Botijão com essas doses',`<select data-srow="${i}.tank" data-r="1"${it?'':' disabled'}>${opts(tks.map(([t,q])=>[t,`${T(t).name} — ${fmt(q)} doses`]),r.tank,it?'Selecione…':'Escolha o sêmen')}</select>
      ${av!==null?`<span class="hint">Disponível neste botijão: ${fmt(av)} doses.</span>`:''}`)}
   ${fldHtml('Quantidade de doses utilizada',`<input data-srow="${i}.qty" type="number" min="1" step="1" inputmode="numeric" value="${esc(r.qty??'')}">`)}
   ${fldHtml('Observação',`<textarea data-srow="${i}.note" rows="1">${esc(r.note??'')}</textarea>`)}
   </div>
   <div class="plus"><button type="button" class="plusbtn" data-a="addSRow" data-v="${i}" aria-label="Adicionar outro sêmen abaixo" title="Adicionar outro sêmen">+</button></div></div>`;
}
function saidaFields(){
  const f=ui.f.saida;if(!f.rows||!f.rows.length)f.rows=[{}];
  const its=f.farm?bItems(f.farm):[];
  return `<div class="form">
   ${fldHtml('Data da saída',fi('saida','date','date'))}
   ${fldHtml('Nome da fazenda',fs('saida','farm',S.farms.map(x=>[x.id,x.name]),'Selecione…',true))}
  </div>${f.rows.map((r,k)=>saidaRow(r,k,f.rows.length,its,f.farm)).join('')}`;
}
function movList(){
  const h=ui.hm;
  return S.movs.filter(m=>(!h.from||m.date>=h.from)&&(!h.to||m.date<=h.to)&&(!h.type||m.type===h.type)&&(!h.farm||m.farm===h.farm)&&(!h.breeder||m.b===h.breeder))
    .sort((a,b)=>b.date.localeCompare(a.date)||(b.ts||0)-(a.ts||0));
}
function vMovs(){
  const sub=ui.msub,h=ui.hm;
  const ttl={entrada:'Entradas de sêmen',saida:'Saídas de sêmen',hist:'Histórico de movimentações'}[sub];
  const type=sub==='entrada'?'entrada':sub==='saida'?'saida':h.type;
  const list=S.movs.filter(m=>(!h.from||m.date>=h.from)&&(!h.to||m.date<=h.to)&&(!type||m.type===type)&&(!h.farm||m.farm===h.farm)&&(!h.breeder||m.b===h.breeder))
    .sort((a,b)=>b.date.localeCompare(a.date)||(b.ts||0)-(a.ts||0));
  return `<div class="card"><div class="card-h"><h3>${ttl}</h3><div class="acts"><button class="btn" data-a="pdfMov">Imprimir PDF</button>
   ${sub!=='saida'?'<button class="btn pri" data-a="newEntrada">Nova entrada</button>':''}${sub!=='entrada'?'<button class="btn pri" data-a="newSaida">Nova saída</button>':''}</div></div>
  <div class="filters" style="margin-bottom:12px">
   ${fldHtml('Data inicial',`<input type="date" data-m="from" value="${h.from}">`)}
   ${fldHtml('Data final',`<input type="date" data-m="to" value="${h.to}">`)}
   ${sub==='hist'?fldHtml('Tipo',`<select data-m="type">${opts([['entrada','Entrada'],['saida','Saída']],h.type,'Todos')}</select>`):''}
   ${fldHtml('Fazenda',`<select data-m="farm">${opts(S.farms.map(x=>[x.id,x.name]),h.farm,'Todas')}</select>`)}
   ${fldHtml('Reprodutor',`<select data-m="breeder">${opts(S.breeders.map(x=>[x.id,x.name]),h.breeder,'Todos')}</select>`)}
  </div><div class="tw">${movTable(list,true)}</div></div>`;
}

const PUN=['Unidade','Quilo (kg)','Litro (L)','Frasco','Caixa','Pacote','Dose'];
const PCAT=['Medicamento','Hormônio IATF','Vacina','Material Descartável','Equipamentos'];
const SHORTU={'Unidade':'un','Quilo (kg)':'kg','Litro (L)':'L','Frasco':'fr','Caixa':'cx','Pacote':'pct','Dose':'doses'};
const shortU=u=>SHORTU[u]||u||'';
const PR=id=>S.products.find(x=>x.id===id)||{name:'?',unit:'',category:''};
const r3=n=>Math.round(n*1000)/1000;
const qtyU=q=>fmt(q);
const psg=m=>m.type==='entrada'?m.qty:-m.qty;
const pBal=(farm,prod)=>r3(S.pmovs.filter(m=>m.farm===farm&&m.product===prod).reduce((a,m)=>a+psg(m),0));
const pTotal=prod=>r3(S.pmovs.filter(m=>m.product===prod).reduce((a,m)=>a+psg(m),0));
const ptitle=()=>({'p-painel':'Produtos','p-cadastro':'Produtos › Cadastro','p-estoque':'Produtos › Estoque','p-movs':'Produtos › Movimentações'}[ui.tab]);
const modName=()=>ui.tab==='fazendas'?'Cadastro':ui.tab.startsWith('p-')?'Produtos':ui.tab.startsWith('i-')?'Serviços da IATF':'Sêmen';
function pItems(fid,cat){
  const m={};
  S.pmovs.filter(x=>x.farm===fid).forEach(x=>{const o=m[x.product]||(m[x.product]={product:x.product,ent:0,sai:0});if(x.type==='entrada')o.ent+=x.qty;else o.sai+=x.qty});
  return Object.values(m).map(o=>({...o,ent:r3(o.ent),sai:r3(o.sai),bal:r3(o.ent-o.sai),p:PR(o.product)}))
    .filter(o=>o.bal>0&&(!cat||o.p.category===cat)).sort((a,b)=>a.p.name.localeCompare(b.p.name));
}
function pcheck(movs){
  const g={};movs.forEach(m=>{const k=m.farm+'|'+m.product;g[k]=r3((g[k]||0)+psg(m))});
  for(const k in g)if(g[k]<0){const [f,p]=k.split('|');return `Esta alteração deixaria o saldo negativo (${PR(p).name}, ${F(f).name}). Ajuste a quantidade ou revise as saídas.`}
  return '';
}
function pmovTable(list,actions){
  if(!list.length)return empty('Nenhuma movimentação encontrada.');
  const pill=m=>`<span class="pill ${m.type==='entrada'?'in':'out'}">${m.type==='entrada'?'Entrada':'Saída'}</span>`;
  const q=m=>`<td class="num ${m.type==='entrada'?'in-t':'out-t'}">${m.type==='entrada'?'+':'−'}${qtyU(m.qty,PR(m.product).unit)}</td>`;
  return `<table><thead><tr><th>Data</th><th>Produto</th><th>Fazenda</th><th>Tipo</th><th class="num">${actions?'Quantidade':'Total'}</th>${actions?'<th>Ações</th>':''}</tr></thead><tbody>
  ${list.map(m=>`<tr><td>${dt(m.date)}</td><td>${esc(PR(m.product).name)}</td><td>${esc(F(m.farm).name)}</td><td>${pill(m)}</td>${q(m)}
   ${actions?`<td><div class="acts"><button class="btn sm" data-a="editPMov" data-v="${m.id}">Editar</button><button class="btn sm dng" data-a="delPMov" data-v="${m.id}">Excluir</button></div></td>`:''}</tr>`).join('')}
  </tbody></table>`;
}
function niceMax(v){const p=Math.pow(10,Math.floor(Math.log10(v)));const f=v/p;return (f<=1?1:f<=2?2:f<=5?5:10)*p}
function pChart(){
  const va=S.farms.find(f=>f.name.trim().toLowerCase()==='vale animal');
  const rows=S.products.map(p=>({p,v:va?pBal(va.id,p.id):0})).filter(o=>o.v>0).sort((a,b)=>b.v-a.v||a.p.name.localeCompare(b.p.name));
  if(!rows.length)return `<div class="card"><div class="card-h"><h3>Estoque atual por produto</h3></div>${empty(va?'Nenhum produto com estoque na Vale Animal no momento.':'Cadastre a fazenda Vale Animal em Cadastro › Fazendas para ver o gráfico.')}</div>`;
  const max=niceMax(rows[0].v);
  return `<div class="card"><div class="card-h"><h3>Estoque atual por produto</h3><span class="muted">Somente Vale Animal</span></div>
   <div class="bars" role="img" aria-label="Gráfico de barras com o estoque atual de cada produto">
   ${rows.map(o=>`<div class="bar-row" title="${esc(o.p.name)}: ${fmt(o.v)}"><span class="bar-name">${esc(o.p.name)}</span><div class="bar-track"><div class="bar" style="width:${(o.v/max*100).toFixed(2)}%"></div></div><span class="bar-val">${fmt(o.v)}</span></div>`).join('')}
   <div class="bar-row axis"><span></span><div class="ticks">${[0,1,2,3,4].map(i=>`<span style="left:${i*25}%">${fmt(r3(max*i/4))}</span>`).join('')}</div><span></span></div></div></div>`;
}

function ficOptions(){
  const pr=S.products.map(p=>({v:'p:'+p.id,label:p.name}));
  const se=S.breeders.map(b=>({v:'s:'+b.id,label:'Sêmen — '+b.name}));
  const c=(a,b)=>a.label.localeCompare(b.label);
  return {pr:pr.sort(c),se:se.sort(c)};
}
const num=v=>v===undefined||v===''||v===null?'':Number(v);
function ficMats(mats=ui.fi.mats){
  const o=ficOptions(),all=[...o.pr,...o.se];
  return mats.map(m=>{const it=all.find(x=>x.v===m.item);
    return it?{label:it.label,qty:num(m.qty),out:num(m.out),saldo:num(m.bal)}:{label:''}});
}

/* ---------- render ---------- */
function responsive(){
  document.querySelectorAll('#app table').forEach(t=>{
    const th=[...t.querySelectorAll('thead th')].map(x=>x.textContent.trim());
    t.querySelectorAll('tbody tr, tfoot tr').forEach(tr=>{let i=0;
      [...tr.children].forEach(td=>{const sp=td.colSpan||1;
        if(sp===1&&th[i]){td.dataset.l=th[i];
          if(td.childNodes.length>1||(td.firstChild&&td.firstChild.nodeType===3))td.innerHTML='<span>'+td.innerHTML+'</span>'}
        i+=sp})})});
}
function render(){
  const view={painel:vPainel,'i-lotes':vLotes,'i-fichas':vFicha,'i-estacao':vEmBreve,'p-painel':vPPainel,'p-cadastro':vPCadastro_,'p-estoque':vPEstoque,'p-movs':vPMovs,fazendas:vFazendas,cadastro:vCadastro,estoque:vEstoque,botijoes:vBotijoes,hist:vHist,movs:vMovs}[ui.tab]();

let tt;function toast(t){const e=document.getElementById('toast');e.textContent=t;e.hidden=false;clearTimeout(tt);tt=setTimeout(()=>e.hidden=true,2800)}

/* ---------- ações ---------- */
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-a]');if(!b)return;
  const a=b.dataset.a,v=b.dataset.v;
  switch(a){
   case 'tab':ui.tab=v;if(v==='movs')ui.msub='hist';if(v==='estoque')ui.farm=null;if(v==='p-estoque')ui.pfarm=null;ui.drawer=false;render();document.getElementById('app').scrollTop=0;break;
   case 'go':ui.tab=v;if(b.dataset.sub)ui.msub=b.dataset.sub;if(v==='estoque')ui.farm=null;if(v==='p-estoque')ui.pfarm=null;ui.drawer=false;render();document.getElementById('app').scrollTop=0;break;
   case 'grp':{const g=b.dataset.home;
     const goHome=g&&!(curTab()===g&&(g!=='movs'||ui.msub==='hist'));
     if(ui.mini&&!isMob()){ui.mini=false;ui.nav[v]=true;if(g){ui.tab=g;if(g==='movs')ui.msub='hist'}}
     else if(goHome){ui.tab=g;if(g==='movs')ui.msub='hist';ui.nav[v]=true}
     else ui.nav[v]=!ui.nav[v];
     render();if(g)document.getElementById('app').scrollTop=0;break}
   case 'toggleSide':if(isMob())ui.drawer=!ui.drawer;else ui.mini=!ui.mini;render();break;
   case 'scrim':ui.drawer=false;render();break;
   case 'newEntrada':ui.f.entrada={date:today(),rows:[{}]};ui.err={};ui.added=0;ui.modal={type:'entrada'};render();break;
   case 'newSaida':ui.f.saida={date:today(),rows:[{}]};ui.err={};ui.added=0;ui.modal={type:'saida'};render();break;
   case 'farm':ui.farm=v;ui.fBreed='';ui.fInd='';render();break;
   case 'back':ui.farm=null;render();break;
   case 'toggle':ui.open[v]=!ui.open[v];render();break;
   case 'pdf':ui.modal={type:'pdf'};render();break;
   case 'print':{const o=document.title,y=ui.modal.type;document.title=y==='fpdf'?'Ficha de Serviços - '+(((ui.modal.data||ui.fi).farm)?F((ui.modal.data||ui.fi).farm).name:''):y==='ppdf'?'Estoque de produtos - '+F(ui.pfarm).name:y==='ppdfmov'?'Movimentações de Produtos':y==='pdfmov'?'Histórico de Movimentações':y==='pdfhist'?(ui.hist.kind==='abastecimento'?'Abastecimento de Nitrogênio':'Medição de Nitrogênio'):'Estoque de sêmen - '+F(ui.farm).name;window.print();document.title=o;break}
   case 'pdfHist':ui.modal={type:'pdfhist'};render();break;
   case 'pdfMov':ui.modal={type:'pdfmov'};render();break;
   case 'export':ui.modal={type:'export'};render();break;
   case 'import':ui.modal={type:'import'};render();break;
   case 'copyExp':{const t=ui.modal.txt||'',ta=document.getElementById('exp-txt');
     const fb=()=>{ta.focus();ta.select();let ok=false;try{ok=document.execCommand('copy')}catch(e){}toast(ok?'Dados copiados.':'Selecione o texto e copie (Ctrl+C).')};
     if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(t).then(()=>toast('Dados copiados.'),fb);else fb();break}
   case 'dlExp':{try{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([ui.modal.txt||''],{type:'application/json'}));a.download='gestao-de-servicos-dados-'+today()+'.json';document.body.appendChild(a);a.click();a.remove();toast('Se o arquivo não baixar, use Copiar dados.')}catch(e){toast('Use Copiar dados.')}break}
   case 'logout':GS_CLOUD.logout();break;
   case 'close':ui.modal=null;ui.confirm=null;render();break;
   case 'confirmYes':{const f=ui.confirm.okFn;ui.confirm=null;f();break}
   case 'reset':S=seed();save();ui.farm=null;done('Dados de exemplo restaurados.');break;
   case 'newBreeder':ui.modal={type:'breeder'};render();break;
   case 'editBreeder':ui.modal={type:'breeder',data:{...B(v)}};render();break;
   case 'delBreeder':{
     const n=S.movs.filter(m=>m.b===v).length;
     ask(n?`${B(v).name} possui ${n} movimentação(ões). Excluir o reprodutor também apaga essas movimentações e atualiza o estoque. Deseja continuar?`:`Excluir o reprodutor ${B(v).name}?`,
       ()=>{S.movs=S.movs.filter(m=>m.b!==v);S.breeders=S.breeders.filter(x=>x.id!==v);done('Reprodutor excluído.')},{title:n?'Atenção':'Confirmar'});break}
   case 'addRow':ui.f.entrada.rows.splice(+v+1,0,{});render();break;
   case 'delRow':ui.f.entrada.rows.splice(+v,1);render();break;
   case 'addSRow':ui.f.saida.rows.splice(+v+1,0,{});render();break;
   case 'delSRow':ui.f.saida.rows.splice(+v,1);render();break;

   case 'delFS':ui.fi.rows.splice(+v,1);render();break;
   case 'addFM':ui.fi.mats.splice(+v+1,0,{});render();break;
   case 'delFM':ui.fi.mats.splice(+v,1);render();break;
   case 'fSave':{const f=ui.fi;
     if(!f.from||!f.farm||!f.tech.trim()){toast('Preencha a data inicial, a fazenda e o técnico responsável.');break}
     if(f.to&&f.to<f.from){toast('A data final não pode ser antes da inicial.');break}
     const rec={from:f.from,to:f.to||'',farm:f.farm,tech:f.tech.trim(),
       rows:f.rows.filter(r=>r.date||r.proc||r.lote||r.etapa||r.total).map(r=>({...r})),
       mats:f.mats.filter(m=>m.item).map(m=>({...m}))};
     if(f.id)Object.assign(S.fichas.find(x=>x.id===f.id),rec);else S.fichas.push({id:nid('fs'),...rec});
     ui.fi=newFi();done('Ficha salva.');break}
   case 'editFicha':{const x=S.fichas.find(q=>q.id===v);ui.fi=JSON.parse(JSON.stringify({id:x.id,from:x.from,to:x.to,farm:x.farm,tech:x.tech,rows:x.rows.length?x.rows:[{}],mats:x.mats.length?x.mats:[{}]}));render();window.scrollTo(0,0);const m=document.querySelector('main,#app');if(m)m.scrollTop=0;break}
   case 'cancelFicha':ui.fi=newFi();render();break;
   case 'delFicha':{const x=S.fichas.find(q=>q.id===v);ask(`Excluir a ficha de ${F(x.farm).name} (${dt(x.from)})?`,()=>{S.fichas=S.fichas.filter(q=>q.id!==v);if(ui.fi.id===v)ui.fi=newFi();done('Ficha excluída.')});break}
   case 'fPdf':ui.modal={type:'fpdf'};render();break;
   case 'printFicha':ui.modal={type:'fpdf',data:S.fichas.find(q=>q.id===v)};render();break;

   case 'newProduct':ui.modal={type:'product'};render();break;

   case 'delProduct':{
     const n=S.pmovs.filter(m=>m.product===v).length;
     ask(n?`${PR(v).name} possui ${n} movimentação(ões). Excluir o produto também apaga essas movimentações e atualiza o estoque. Deseja continuar?`:`Excluir o produto ${PR(v).name}?`,
       ()=>{S.pmovs=S.pmovs.filter(m=>m.product!==v);S.products=S.products.filter(x=>x.id!==v);done('Produto excluído.')},{title:n?'Atenção':'Confirmar'});break}
   case 'pfarm':ui.pfarm=v;ui.pcat='';render();break;
   case 'pback':ui.pfarm=null;render();break;
   case 'pPdf':ui.modal={type:'ppdf'};render();break;
   case 'pPdfMov':ui.modal={type:'ppdfmov'};render();break;
   case 'newPEntrada':ui.f.pentrada={date:today(),rows:[{}]};ui.err={};ui.modal={type:'pentrada'};render();break;
   case 'newPSaida':ui.f.psaida={date:today(),rows:[{}]};ui.err={};ui.modal={type:'psaida'};render();break;
   case 'addPRow':ui.f['p'+b.dataset.k].rows.splice(+v+1,0,{});render();break;
   case 'delPRow':ui.f['p'+b.dataset.k].rows.splice(+v,1);render();break;
   case 'editPMov':ui.modal={type:'pmov',data:{...S.pmovs.find(m=>m.id===v)}};render();break;
   case 'delPMov':
     ask('Tem certeza que deseja apagar este registro? Essa ação atualizará o estoque.',()=>{
       const rest=S.pmovs.filter(x=>x.id!==v),er=pcheck(rest);
       if(er){ui.confirm=null;render();toast(er);return}
       S.pmovs=rest;done('Movimentação excluída. Estoque atualizado.')});break;
   case 'wipe':ui.modal={type:'wipe'};render();break;
   case 'newFarm':ui.modal={type:'farm'};render();break;
   case 'editFarm':ui.modal={type:'farm',data:{...F(v)}};render();break;
   case 'delFarm':{
     const n=S.movs.filter(m=>m.farm===v).length;
     ask(n?`${F(v).name} possui ${n} movimentação(ões) de sêmen. Excluir a fazenda também apaga essas movimentações e atualiza o estoque. Deseja continuar?`:`Excluir a fazenda ${F(v).name}?`,
       ()=>{S.movs=S.movs.filter(m=>m.farm!==v);S.farms=S.farms.filter(x=>x.id!==v);done('Fazenda excluída.')},{title:n?'Atenção':'Confirmar'});break}
   case 'newTank':ui.modal={type:'tank'};render();break;
   case 'editTank':ui.modal={type:'tank',data:{...T(v)}};render();break;
   case 'delTank':
     if(S.movs.some(m=>m.tank===v)){toast('Este botijão tem movimentações e não pode ser excluído.');break}
     ask(`Excluir o botijão ${T(v).name} e seu histórico de nitrogênio?`,()=>{S.meas=S.meas.filter(x=>x.tank!==v);S.tanks=S.tanks.filter(x=>x.id!==v);done('Botijão excluído.')});break;
   case 'meas':ui.modal={type:'meas',data:{tank:v}};render();break;
   case 'refill':ui.modal={type:'refill',data:{tank:v}};render();break;
   case 'hist':ui.hist={tank:v||'',farm:'',kind:b.dataset.k||''};ui.tab='hist';render();break;
   case 'editMeas':{const x=S.meas.find(y=>y.id===v);ui.modal={type:x.kind==='medicao'?'meas':'refill',data:{...x}};render();break}
   case 'delMeas':ask('Tem certeza que deseja apagar este registro?',()=>{S.meas=S.meas.filter(x=>x.id!==v);done('Registro excluído.')});break;
   case 'editMov':ui.modal={type:'mov',data:{...S.movs.find(m=>m.id===v)}};render();break;
   case 'delMov':{
     const m=S.movs.find(x=>x.id===v);
     ask('Tem certeza que deseja apagar este registro? Essa ação atualizará o estoque.',()=>{
       const rest=S.movs.filter(x=>x.id!==v), er=check(rest);
       if(er){ui.confirm=null;render();toast(er);return}
       S.movs=rest;done('Movimentação excluída. Estoque atualizado.')});break}
  }
});

document.addEventListener('change',e=>{
  const t=e.target,d=t.dataset;
  if(d.f){const [f,n]=d.f.split('.');ui.f[f][n]=t.value;
    if(f==='saida'&&n==='farm'){ui.f.saida.rows=(ui.f.saida.rows||[{}]).map(r=>({qty:r.qty,note:r.note}))}
    if(f==='psaida'&&n==='farm'){ui.f.psaida.rows=(ui.f.psaida.rows||[{}]).map(r=>({qty:r.qty,note:r.note}))}
    if(d.r)render()}
  if(d.pf){const [kd,i,k]=d.pf.split('.');ui.f['p'+kd].rows[+i][k]=t.value;if(d.r)render()}
  if(d.srow){const [i,k]=d.srow.split('.');const r=ui.f.saida.rows[+i];r[k]=t.value;
    if(k==='item'){const g=bItems(ui.f.saida.farm).find(o=>o.b===t.value);const ks=g?Object.keys(g.tanks).filter(x=>g.tanks[x]>0):[];r.tank=ks.length===1?ks[0]:''}
    if(d.r)render()}
  if(d.row){const [i,k]=d.row.split('.');ui.f.entrada.rows[+i][k]=t.value;if(d.r)render()}
  if(d.s){ui[d.s]=t.value;render()}
  if(d.h){ui.hist[d.h]=t.value;render()}
  if(d.m){ui.hm[d.m]=t.value;render()}
  if(d.pm){ui.pm[d.pm]=t.value;render()}
  if(d.impfile&&t.files&&t.files[0]){const r=new FileReader();r.onload=()=>{const ta=document.querySelector('textarea[name=json]');if(ta)ta.value=String(r.result)};r.readAsText(t.files[0])}
  if(d.lf){ui.lf[d.lf]=t.value;render()}
  if(d.fi){ui.fi[d.fi]=t.value;
    if(d.fi==='farm'){ui.fi.rows=ui.fi.rows.map(r=>({...r,lote:'',total:''}));render()}}
  if(d.fs){const [i,k]=d.fs.split('.');const r=ui.fi.rows[+i];r[k]=t.value;
    if(k==='lote'){const l=S.lotes.find(x=>x.id===t.value);if(l)r.total=l.total}
    if(d.r)render()}
  if(d.fm){const [i,k]=d.fm.split('.');ui.fi.mats[+i][k]=t.value;if(k==='item')render()}
});

document.addEventListener('submit',e=>{
  e.preventDefault();
  const form=e.target,k=form.dataset.form;if(!k)return;
  const fd=Object.fromEntries(new FormData(form));
  const modalErr=msg=>{if(!['entrada','saida','pentrada','psaida'].includes(k))ui.modal.data={...(ui.modal.data||{}),...fd};ui.modal.err=msg;render()};
  if(k==='entrada'){
    const f=ui.f.entrada,rows=f.rows||[];let er='';const used={};
    if(!f.date||!f.farm)er='Preencha a data e a fazenda.';
    for(let i=0;i<rows.length&&!er;i++){
      const r=rows[i],q=Number(r.qty),n='Sêmen '+(i+1)+': ';
      if(!r.tank||!r.breeder||!r.ind)er=n+'preencha botijão, reprodutor e indicação.';
      else if(!(q>0)||!Number.isInteger(q))er=n+'a quantidade deve ser um número inteiro maior que zero.';
      else{used[r.tank]=(used[r.tank]||0)+q;const t=T(r.tank),free=t.max-tankStock(r.tank);if(used[r.tank]>free)er=n+`o botijão ${t.name} só tem espaço para ${fmt(free)} doses.`}
    }
    ui.err.entrada=er;
    if(er){render();return}
    const ts=Date.now();
    rows.forEach((r,i)=>S.movs.push({id:nid('m'),ts:ts+i,date:f.date,type:'entrada',b:r.breeder,ind:r.ind,farm:f.farm,tank:r.tank,qty:Number(r.qty),note:r.note||''}));
    ui.f.entrada={date:f.date,farm:f.farm,rows:[{}]};ui.modal=null;ui.added=0;save();render();
    toast(rows.length>1?`${rows.length} entradas registradas. Estoque atualizado.`:'Entrada registrada. Estoque atualizado.');return}
  if(k==='saida'){
    const f=ui.f.saida,rows=f.rows||[];let er='';const plan=[];
    const its=f.farm?bItems(f.farm):[];
    const wk={};
    its.forEach(g=>{wk[g.b]=g.inds.map(x=>({ind:x.ind,tanks:{...x.tanks},
      first:Math.min(...S.movs.filter(m=>m.farm===f.farm&&m.b===g.b&&m.ind===x.ind&&m.type==='entrada').map(m=>+m.date.replace(/-/g,'')))}))});
    if(!f.date||!f.farm)er='Preencha a data e a fazenda.';
    for(let i=0;i<rows.length&&!er;i++){
      const r=rows[i],q=Number(r.qty),n='Sêmen '+(i+1)+': ';
      if(!r.item||!r.tank)er=n+'preencha o reprodutor e o botijão.';
      else if(!(q>0)||!Number.isInteger(q))er=n+'a quantidade deve ser um número inteiro maior que zero.';
      else{
        const parts=(wk[r.item]||[]).filter(x=>(x.tanks[r.tank]||0)>0).sort((a,b)=>a.first-b.first);
        const avail=parts.reduce((a,x)=>a+x.tanks[r.tank],0);
        if(q>avail)er=n+`o botijão ${T(r.tank).name} tem só ${fmt(avail)} doses deste sêmen${i>0?' (já descontadas as saídas acima)':''}.`;
        else{let rest=q;parts.forEach(x=>{const take=Math.min(rest,x.tanks[r.tank]);if(take>0){x.tanks[r.tank]-=take;rest-=take;plan.push({b:r.item,ind:x.ind,tank:r.tank,qty:take,note:r.note||''})}})}
      }
    }
    ui.err.saida=er;
    if(er){render();return}
    const ts=Date.now();
    plan.forEach((p,i)=>S.movs.push({id:nid('m'),ts:ts+i,date:f.date,type:'saida',b:p.b,ind:p.ind,farm:f.farm,tank:p.tank,qty:p.qty,note:p.note}));
    ui.f.saida={date:f.date,farm:f.farm,rows:[{}]};ui.modal=null;ui.added=0;save();render();
    toast(rows.length>1?`${rows.length} saídas registradas. Estoque atualizado.`:'Saída registrada. Estoque atualizado.');return}
  if(k==='breeder'){
    const name=(fd.name||'').trim(),id=form.dataset.id;
    if(!name||!fd.breed)return modalErr('Informe o nome e a raça.');
    if(S.breeders.some(b=>b.id!==id&&b.name.toLowerCase()===name.toLowerCase()))return modalErr('Já existe um reprodutor com esse nome.');
    if(id){Object.assign(B(id),{name,breed:fd.breed})}else S.breeders.push({id:nid('b'),name,breed:fd.breed});
    return done('Reprodutor salvo.')}
  if(k==='lote'){
    const id=form.dataset.id,total=Number(fd.total),name=(fd.name||'').trim();
    if(!fd.farm||!name||!fd.category||!fd.start||!fd.end)return modalErr('Preencha fazenda, lote, categoria e as datas da parição.');
    if(!(total>0)||!Number.isInteger(total))return modalErr('O total deve ser um número inteiro maior que zero.');
    if(fd.end<fd.start)return modalErr('O final da parição não pode ser antes do início.');
    const rec={farm:fd.farm,name,total,category:fd.category,start:fd.start,end:fd.end,status:fd.status||'Aberto'};
    if(id)Object.assign(S.lotes.find(x=>x.id===id),rec);else S.lotes.push({id:nid('l'),...rec});
    return done('Lote salvo.')}
  if(k==='product'){
    const name=(fd.name||'').trim(),id=form.dataset.id;
    if(!name||!fd.category)return modalErr('Informe o nome e a categoria.');
    if(S.products.some(p=>p.id!==id&&p.name.toLowerCase()===name.toLowerCase()))return modalErr('Já existe um produto com esse nome.');
    if(id)Object.assign(PR(id),{name,category:fd.category});else S.products.push({id:nid('r'),name,category:fd.category});
    return done('Produto salvo.')}
  if(k==='pentrada'){
    const f=ui.f.pentrada,rows=f.rows||[];let er='';
    if(!f.date||!f.farm)er='Preencha a data e a fazenda.';
    for(let i=0;i<rows.length&&!er;i++){const r=rows[i],q=Number(r.qty),n='Produto '+(i+1)+': ';
      if(!r.product)er=n+'escolha o produto.';else if(!(q>0))er=n+'a quantidade deve ser maior que zero.'}
    ui.err.pentrada=er;if(er){render();return}
    const ts=Date.now();
    rows.forEach((r,i)=>S.pmovs.push({id:nid('p'),ts:ts+i,date:f.date,type:'entrada',product:r.product,farm:f.farm,qty:Number(r.qty),note:r.note||''}));
    ui.f.pentrada={date:f.date,farm:f.farm,rows:[{}]};ui.modal=null;save();render();
    toast(rows.length>1?`${rows.length} entradas registradas. Estoque atualizado.`:'Entrada registrada. Estoque atualizado.');return}
  if(k==='psaida'){
    const f=ui.f.psaida,rows=f.rows||[];let er='';const used={};
    if(!f.date||!f.farm)er='Preencha a data e a fazenda.';
    for(let i=0;i<rows.length&&!er;i++){const r=rows[i],q=Number(r.qty),n='Produto '+(i+1)+': ';
      if(!r.product)er=n+'escolha o produto.';
      else if(!(q>0))er=n+'a quantidade deve ser maior que zero.';
      else{used[r.product]=r3((used[r.product]||0)+q);const b=pBal(f.farm,r.product);
        if(used[r.product]>b)er=n+`saída maior que o estoque disponível (${fmt(b)}).`}}
    ui.err.psaida=er;if(er){render();return}
    const ts=Date.now();
    rows.forEach((r,i)=>S.pmovs.push({id:nid('p'),ts:ts+i,date:f.date,type:'saida',product:r.product,farm:f.farm,qty:Number(r.qty),note:r.note||''}));
    ui.f.psaida={date:f.date,farm:f.farm,rows:[{}]};ui.modal=null;save();render();
    toast(rows.length>1?`${rows.length} saídas registradas. Estoque atualizado.`:'Saída registrada. Estoque atualizado.');return}
  if(k==='pmov'){
    const id=form.dataset.id,q=Number(fd.qty);
    if(!(q>0)||!fd.date)return modalErr('Informe data e uma quantidade maior que zero.');
    const upd=S.pmovs.map(m=>m.id===id?{...m,date:fd.date,product:fd.product,farm:fd.farm,qty:q,note:fd.note||''}:m);
    const er=pcheck(upd);if(er)return modalErr(er);
    S.pmovs=upd;return done('Movimentação atualizada. Estoque recalculado.')}
  if(k==='import'){
    let o;try{o=JSON.parse(fd.json||'')}catch(e){return modalErr('Os dados colados não são válidos. Use o texto gerado em Exportar dados.')}
    const src=o&&o.dados?o.dados:o,out={};let n=0;
    for(const c of Object.keys(emptyS())){const a=src&&src[c];
      if(a===undefined){out[c]=[];continue}
      if(!Array.isArray(a)||a.some(x=>!x||typeof x!=='object'||typeof x.id!=='string'))return modalErr('Dados inválidos em "'+c+'".');
      out[c]=a;n+=a.length}
    if(!n)return modalErr('Não encontrei nenhum registro para importar.');
    const resumo=Object.keys(out).filter(c=>out[c].length).map(c=>c+': '+out[c].length).join(', ');
    return ask('Substituir TODOS os dados deste app por estes? ('+resumo+')',()=>{Object.keys(out).forEach(c=>{S[c]=out[c]});done('Dados importados.')},{ok:'Substituir tudo'})}
  if(k==='wipe'){
    if(!fd.movs&&!fd.breeders&&!fd.farms&&!fd.tanks&&!fd.pmovs&&!fd.products&&!fd.lotes&&!fd.fichas)return modalErr('Marque pelo menos uma opção.');
    if(fd.movs||fd.breeders||fd.farms||fd.tanks)S.movs=[];
    if(fd.pmovs||fd.products||fd.farms)S.pmovs=[];
    if(fd.products)S.products=[];
    if(fd.lotes||fd.farms)S.lotes=[];
    if(fd.fichas||fd.farms)S.fichas=[];
    if(fd.breeders)S.breeders=[];
    if(fd.farms)S.farms=[];
    if(fd.tanks){S.tanks=[];S.meas=[]}
    ui.farm=null;ui.fBreed='';ui.fInd='';ui.open={};
    ui.f={entrada:{date:today()},saida:{date:today()},pentrada:{date:today()},psaida:{date:today()}};ui.pfarm=null;
    ui.hm={from:'',to:'',type:'',farm:'',breeder:''};ui.hist={tank:'',farm:'',kind:ui.hist.kind||''};
    return done('Dados zerados. Pode cadastrar do zero.')}
  if(k==='farm'){
    const name=(fd.name||'').trim(),id=form.dataset.id,mat=fd.matrices===''?null:Number(fd.matrices);
    if(!name)return modalErr('Informe o nome da fazenda.');
    if(mat!==null&&(!Number.isInteger(mat)||mat<0))return modalErr('O total de matrizes deve ser um número inteiro.');
    if(S.farms.some(f=>f.id!==id&&f.name.toLowerCase()===name.toLowerCase()))return modalErr('Já existe uma fazenda com esse nome.');
    const rec={name,owner:(fd.owner||'').trim(),city:(fd.city||'').trim(),state:fd.state||'',matrices:mat};
    if(id)Object.assign(F(id),rec);else S.farms.push({id:nid('f'),...rec});
    return done('Fazenda salva.')}
  if(k==='tank'){
    const name=(fd.name||'').trim(),id=form.dataset.id,max=Number(fd.max);
    if(!name||!fd.cap||!(max>0))return modalErr('Informe nome, capacidade e máximo de doses.');
    if(S.tanks.some(t=>t.id!==id&&t.name.toLowerCase()===name.toLowerCase()))return modalErr('Já existe um botijão com esse nome.');
    if(id){Object.assign(T(id),{name,cap:Number(fd.cap),max})}else S.tanks.push({id:nid('t'),name,cap:Number(fd.cap),max});
    return done('Botijão salvo.')}
  if(k==='meas'||k==='refill'){
    const id=form.dataset.id,ref=k==='refill';
    if(!fd.tank||!fd.date||fd.level===''||Number(fd.level)<0)return modalErr('Informe botijão, data e nível em centímetros.');
    if(ref&&(!(Number(fd.liters)>0)))return modalErr('Informe os litros abastecidos.');
    const rec={tank:fd.tank,date:fd.date,level:Number(fd.level),kind:ref?'abastecimento':'medicao',liters:ref?Number(fd.liters):0,total:ref?Number(fd.total||0):0,note:fd.note||''};
    if(id)Object.assign(S.meas.find(x=>x.id===id),rec);else S.meas.push({id:nid('n'),...rec});
    return done(ref?'Abastecimento registrado.':'Medição registrada.')}
  if(k==='mov'){
    const id=form.dataset.id,q=Number(fd.qty);
    if(!(q>0)||!Number.isInteger(q)||!fd.date)return modalErr('Informe data e uma quantidade inteira maior que zero.');
    const upd=S.movs.map(m=>m.id===id?{...m,date:fd.date,b:fd.b,ind:fd.ind,farm:fd.farm,tank:fd.tank,qty:q,note:fd.note||''}:m);
    const er=check(upd);if(er)return modalErr(er);
    S.movs=upd;return done('Movimentação atualizada. Estoque recalculado.')}
});

matchMedia('(max-width:820px)').addEventListener('change',()=>{ui.drawer=false;render()});
render();
init();
