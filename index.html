<style>
/* Layout: barra lateral de módulos + área de trabalho com subabas; tabelas rolam dentro do próprio contêiner */

}

  --in:#5cc496; --in-bg:#12332a; --out:#f0966f; --out-bg:#3a2119;
  --warn:#f2b45c; --warn-bg:#3a2b10; --danger:#ff8a80; color-scheme:dark}}

*{box-sizing:border-box}

.side.mini{visibility:hidden;overflow:hidden;padding:0;border:0;width:0;min-width:0}.side.mini .lbl,.side.mini .chev,.side.mini .brand-t,.side.mini .kids .kids{display:none}

.um{position:relative;flex:none}button.hu{border:0;color:inherit;font-family:inherit;cursor:pointer;display:inline-flex;align-items:center;gap:7px}button.hu:hover{background:rgba(255,255,255,.26)}.ud{width:8px;height:8px;border-radius:50%;background:#e9b44c}.ud.ok{background:#4cc38a}.ud.bad{background:#e5604d}.um-m{position:absolute;right:0;top:calc(100% + 8px);min-width:210px;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 24px rgba(20,33,61,.2);padding:6px;z-index:60;display:flex;flex-direction:column}.um-m button{text-align:left;padding:10px 12px;border:0;background:transparent;border-radius:6px;font:inherit;font-size:14px;color:inherit;cursor:pointer}.um-m button:hover{background:var(--bg)}.um-m .danger{color:#b3261e}.um-m hr{border:0;border-top:1px solid var(--line);margin:4px 0;width:100%}

.tw{overflow-x:auto}
.small table{font-size:12.5px}

.small td{padding:8px 10px}

      {id:'b3',name:'JAGUAR FIV',breed:'Brangus'},{id:'b4',name:'MESTRE DO VALE',breed:'Senepol'},{id:'b5',name:'LUA NOVA',breed:'Embrião'}],
    tanks:[{id:'t1',name:'Felicidade',cap:34,max:1500},{id:'t2',name:'Gabriela',cap:20,max:800},{id:'t3',name:'Esperança',cap:47,max:2200}],

    meas:[
      {id:'n1',tank:'t1',kind:'medicao',date:'2026-10-28',level:24,liters:0,total:0,note:''},
      {id:'n2',tank:'t1',kind:'abastecimento',date:'2026-10-20',level:28,liters:12,total:168,note:'Fornecedor local'},

/* ---------- armazenamento: banco compartilhado (db) ou, sem ele, este navegador ---------- */
const emptyS=()=>({farms:[],breeders:[],tanks:[],movs:[],meas:[],products:[],pmovs:[],lotes:[],fichas:[],estacoes:[],lancs:[],ordens:[],contacts:[],diarias:[],kms:[],eventos:[],tarefas:[],tcols:[]});
let S=emptyS();
let DB=null,dbState='conectando',slowT=null,busy=false,q=[],needRender=false;
const synced={farms:{},breeders:{},tanks:{},movs:{},meas:{},products:{},pmovs:{},lotes:{},fichas:{},estacoes:{},lancs:{},ordens:{},contacts:{},diarias:{},kms:{},eventos:{},tarefas:{},tcols:{}},lastSnap={},held={},got={};
const nid=p=>p+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const loadLocal=()=>{try{const r=localStorage.getItem(KEY);return r?JSON.parse(r):null}catch(e){return null}};
function bannerTxt(){return {ok:'Conectado à nuvem: tudo o que for lançado fica salvo e aparece para todos os usuários.',
  conectando:'Conectando ao banco de dados…',lento:'Não foi possível alcançar o banco de dados agora. Os dados podem estar desatualizados.',
  erro:'O banco de dados recusou o acesso. Saia e entre de novo.',local:'Sem conexão com a nuvem: os dados ficam salvos só neste navegador. Confira o arquivo config.js.'}[dbState]}
function save(){
  if(!DB){
    if(dbState==='conectando'){toast('Aguarde: conectando ao banco de dados…');return}
    try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}
    return}
  for(const c in synced){
    const cur={};S[c].forEach(x=>{cur[x.id]=JSON.stringify(x)});
    for(const id in cur)if(synced[c][id]!==cur[id])q.push({op:'set',c,id,data:JSON.parse(cur[id])});
    for(const id in synced[c])if(!(id in cur))q.push({op:'del',c,id});
    synced[c]=cur;
  }
  pump();
}
async function pump(){
  if(busy)return;busy=true;let fail=null;
  while(q.length&&!fail){
    const o=q.shift();
    for(let t=0;t<2;t++){
      try{const ref=DB.collection(o.c).doc(o.id);if(o.op==='set')await ref.set(o.data);else await ref.delete();fail=null;break}
      catch(e){fail=e||{};if(fail.code!=='unavailable')break;await new Promise(r=>setTimeout(r,400+Math.random()*600))}
    }
  }
  busy=false;
  if(fail){q=[];Object.keys(lastSnap).forEach(c=>applyCol(c,lastSnap[c]));
    toast(fail.code==='invalid_argument'?'Sem permissão para gravar. Saia e entre de novo.':'Não foi possível salvar agora. Tente de novo.')}
  const hk=Object.keys(held);
  hk.forEach(c=>{applyCol(c,held[c]);delete held[c]});
  if(fail||hk.length)softRender();
}
function applyCol(c,arr){S[c]=arr;synced[c]={};arr.forEach(x=>{synced[c][x.id]=JSON.stringify(x)})}
function onSnap(c,snap){
  const arr=snap.docs.map(x=>JSON.parse(JSON.stringify(x.data())));
  lastSnap[c]=arr;
  if(!snap.metadata.fromCache){got[c]=1;if(Object.keys(got).length===Object.keys(synced).length){dbState='ok';clearTimeout(slowT)}}
  if(busy||q.length){held[c]=arr;return}
  const cn=o=>JSON.stringify(o,(k,v)=>v&&typeof v==='object'&&!Array.isArray(v)?Object.keys(v).sort().reduce((r,x)=>(r[x]=v[x],r),{}):v);
  const cur={};(S[c]||[]).forEach(x=>{cur[x.id]=cn(x)});const nw={};arr.forEach(x=>{nw[x.id]=cn(x)});
  const ch=[];for(const id in nw)if(cur[id]!==nw[id])ch.push(id);for(const id in cur)if(!(id in nw))ch.push(id);
  if(!ch.length){applyCol(c,arr);return}
  if(c==='tarefas'&&ui.modal&&ui.modal.type==='tk'&&tkU().sel&&!ch.includes(tkU().sel)){applyCol(c,arr);return}
  applyCol(c,arr);softRender();
}
function softRender(){
  const a=document.activeElement;
  if(a&&a.dataset&&a.dataset.tkf==='fqtop'){needRender=true;return}
  if(a&&a.form&&a.form.classList&&a.form.classList.contains('tk-addf')){needRender=true;return}
  if(a&&a.closest&&a.closest('#modal-root')&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)){needRender=true;return}
  needRender=false;render();
}
document.addEventListener('focusout',()=>{if(needRender)setTimeout(()=>{const a=document.activeElement;if(!(a&&a.closest&&a.closest('#modal-root')))softRender()},60)});
async function init(){
  try{if(window.GS_CLOUD&&GS_CLOUD.enabled)DB=await GS_CLOUD.connect();else if(window.claude&&window.claude.use)DB=await window.claude.use('db')}catch(e){DB=null}
  if(!DB){dbState='local';const l=loadLocal();if(l)S=Object.assign(emptyS(),l);render();return}
  slowT=setTimeout(()=>{if(dbState!=='ok'){dbState='lento';render()}},10000);
  Object.keys(synced).forEach(c=>DB.collection(c).onSnapshot(sn=>onSnap(c,sn),e=>{dbState=(e&&e.code==='unavailable')?'lento':'erro';render()}));
}

const ATIVS=['IMPLANTADAS','RETIRADAS','INSEMINADAS','DIAGNÓSTICO DA IATF','DIAGNÓSTICO FINAL','EXAME DE ANDROLÓGICO','EXAME DE BRUCELOSE','DIÁRIA VETERINÁRIA','PROCEDIMENTO CIRÚRGICO'];
const tc=v=>String(v||'').trim().toLowerCase().replace(/(^|[\s\-\/])([^\s\-\/])/g,(m,a,b)=>a+b.toUpperCase());
const CIDADES=['ÁGUA BOA','BARRA DO GARÇAS','NOVA XAVANTINA','NOVA NAZARÉ','COCALINHO','RIBEIRÃO CASCALHEIRA','CANARANA','CAMPINÁPOLIS','NOVO SÃO JOAQUIM','PARANATINGA','ARAGUAIANA','SÃO JOSÉ XINGU'].map(tc).sort((a,b)=>a.localeCompare(b,'pt-BR'));
const cityOpts=cur=>[...CIDADES,...(cur&&!CIDADES.includes(cur)?[cur]:[])].map(x=>[x,x]);

function check(movs){
  const g={};
  movs.forEach(m=>{const k=[m.farm,m.b,m.ind,m.tank].join('|');g[k]=(g[k]||0)+sg(m)});
  for(const k in g)if(g[k]<0){const [f,b,i,t]=k.split('|');
    return `Esta alteração deixaria o saldo negativo (${B(b).name}, ${F(f).name}, botijão ${T(t).name}). Ajuste a quantidade ou revise as saídas.`}
  return '';
}

function agLanes(list){const out={};let cl=[],cend=-1;
  const flush=()=>{const L=cl.reduce((m,e)=>Math.max(m,out[e.id].lane+1),1);cl.forEach(e=>out[e.id].n=L);cl=[]};
  const lanes=[];
  list.forEach(e=>{const s0=tmin(e.start),e0=Math.max(tmin(e.etime),s0+30);
    if(cl.length&&s0>=cend){flush();lanes.length=0}
    let l=lanes.findIndex(x=>x<=s0);if(l<0){l=lanes.length;lanes.push(0)}lanes[l]=e0;cend=Math.max(cl.length?cend:0,e0);
    out[e.id]={lane:l,s:s0,e:e0};cl.push(e)});
  if(cl.length)flush();return out}

const PUN=['Unidade','Quilo (kg)','Litro (L)','Frasco','Caixa','Pacote','Dose'];
const PCAT=['Medicamento','Hormônio IATF','Vacina','Material Descartável','Equipamentos'];
const SHORTU={'Unidade':'un','Quilo (kg)':'kg','Litro (L)':'L','Frasco':'fr','Caixa':'cx','Pacote':'pct','Dose':'doses'};
const shortU=u=>SHORTU[u]||u||'';
const PR=id=>S.products.find(x=>x.id===id)||{name:'?',unit:'',category:''};
const r3=n=>Math.round(n*1000)/1000;
const qtyU=q=>fmt(q);
const psg=m=>m.type==='entrada'?m.qty:-m.qty;
const pBal=(farm,prod)=>r3(S.pmovs.filter(m=>m.farm===farm&&m.product===prod).reduce((a,m)=>a+psg(m),0));
const pTotal=prod=>r3(S.pmovs.filter(m=>m.product===prod).reduce((a,m)=>a+psg(m),0));
const ptitle=()=>({'p-painel':'Estoque › Produtos','p-cadastro':'Estoque › Produtos › Cadastro','p-estoque':'Estoque › Produtos › Estoque','p-movs':'Estoque › Produtos › Movimentações'}[ui.tab]);
const modName=()=>ui.tab==='tarefas'?'Tarefas':ui.tab==='inicio'?'Início':ui.tab==='agenda'?'Agenda':ui.tab.startsWith('f-')?'Financeiro':(ui.tab==='fazendas'||ui.tab==='contatos'||ui.tab==='negociacoes')?'CRM':(ui.tab==='e-painel'||ui.tab==='e-cad'||ui.tab==='e-mov')?'Estoque':ui.tab.startsWith('p-')?'Produtos':ui.tab.startsWith('i-')?'Serviços':'Sêmen';
function pItems(fid,cat){
  const m={};
  S.pmovs.filter(x=>x.farm===fid).forEach(x=>{const o=m[x.product]||(m[x.product]={product:x.product,ent:0,sai:0});if(x.type==='entrada')o.ent+=x.qty;else o.sai+=x.qty});
  return Object.values(m).filter(o=>!PR(o.product).inativo).map(o=>({...o,ent:r3(o.ent),sai:r3(o.sai),bal:r3(o.ent-o.sai),p:PR(o.product)}))
    .filter(o=>o.bal>0&&(!cat||o.p.category===cat)).sort((a,b)=>a.p.name.localeCompare(b.p.name));
}
function pcheck(movs){
  const g={};movs.forEach(m=>{const k=m.farm+'|'+m.product;g[k]=r3((g[k]||0)+psg(m))});
  for(const k in g)if(g[k]<0){const [f,p]=k.split('|');return `Esta alteração deixaria o saldo negativo (${PR(p).name}, ${F(f).name}). Ajuste a quantidade ou revise as saídas.`}
  return '';
}
function pmovTable(list,actions){
  if(!list.length)return empty('Nenhuma movimentação encontrada.');
  const pill=m=>`<span class="pill ${m.type==='entrada'?'in':'out'}">${m.type==='entrada'?'Entrada':'Saída'}</span>`;
  const q=m=>`<td class="num ${m.type==='entrada'?'in-t':'out-t'}">${m.type==='entrada'?'+':'−'}${qtyU(m.qty,PR(m.product).unit)}</td>`;
  return `<table><thead><tr><th>Data</th><th>Produto</th><th>Fazenda</th><th>Tipo</th><th class="num">${actions?'Quantidade':'Total'}</th>${actions?'<th>Ações</th>':''}</tr></thead><tbody>
  ${list.map(m=>`<tr><td>${dt(m.date)}</td><td>${esc(PR(m.product).name)}</td><td>${esc(F(m.farm).name)}</td><td>${pill(m)}</td>${q(m)}
   ${actions?`<td><div class="acts"><button class="btn sm" data-a="editPMov" data-v="${m.id}">Editar</button><button class="btn sm dng" data-a="delPMov" data-v="${m.id}">Excluir</button></div></td>`:''}</tr>`).join('')}
  </tbody></table>`;
}
function niceMax(v){const p=Math.pow(10,Math.floor(Math.log10(v)));const f=v/p;return (f<=1?1:f<=2?2:f<=5?5:10)*p}
function pChart(){
  const va=S.farms.find(f=>f.name.trim().toLowerCase()==='vale animal');
  const rows=S.products.filter(p=>!p.inativo).map(p=>({p,v:va?pBal(va.id,p.id):0})).filter(o=>o.v>0).sort((a,b)=>b.v-a.v||a.p.name.localeCompare(b.p.name));
  if(!rows.length)return `<div class="card"><div class="card-h"><h3>Estoque atual por produto</h3></div>${empty(va?'Nenhum produto com estoque na Vale Animal no momento.':'Cadastre a fazenda Vale Animal em CRM › Empresas para ver o gráfico.')}</div>`;
  const max=niceMax(rows[0].v);
  return `<div class="card"><div class="card-h"><h3>Estoque atual por produto</h3><span class="muted">Somente Vale Animal</span></div>
   <div class="bars" role="img" aria-label="Gráfico de barras com o estoque atual de cada produto">
   ${rows.map(o=>`<div class="bar-row" title="${esc(o.p.name)}: ${fmt(o.v)}"><span class="bar-name">${esc(o.p.name)}</span><div class="bar-track"><div class="bar" style="width:${(o.v/max*100).toFixed(2)}%"></div></div><span class="bar-val">${fmt(o.v)}</span></div>`).join('')}
   <div class="bar-row axis"><span></span><div class="ticks">${[0,1,2,3,4].map(i=>`<span style="left:${i*25}%">${fmt(r3(max*i/4))}</span>`).join('')}</div><span></span></div></div></div>`;
}

function vEPainel(){
  const doses=S.movs.reduce((a,m)=>a+sg(m),0),touros=new Set(S.movs.filter(m=>m.type).map(m=>m.b)).size;
  const lastT=S.tanks.map(t=>({t,l:tankLast(t.id)}));
  const lowT=lastT.filter(o=>o.l&&o.l.level<LOW);
  const lowMeds=S.meas.filter(x=>x.kind==='medicao'&&x.level<LOW).sort((a,b)=>b.date.localeCompare(a.date)||(b.ts||0)-(a.ts||0));

  const medRows=lowMeds.map(x=>{const r=resolv(x);return `<tr><td>${dt(x.date)}</td><td><b>${esc(T(x.tank).name)}</b></td><td class="num"><b>${x.level} cm</b></td><td><span class="pill warn">Nitrogênio baixo</span></td><td>${r?'Reabastecido em '+dt(r.date).slice(0,5):'<span class="pill out">Precisa reabastecer</span>'}</td></tr>`}).join('');

   ${rows.map(o=>`<div class="bar-row" title="${esc(o.p.name)}: ${fmt(o.v)}"><span class="bar-name">${esc(o.p.name)}</span><div class="bar-track"><div class="bar" style="width:${(o.v/max*100).toFixed(2)}%"></div></div><span class="bar-val">${fmt(o.v)}</span></div>`).join('')}
   <div class="bar-row axis"><span></span><div class="ticks">${[0,1,2,3,4].map(i=>`<span style="left:${i*25}%">${fmt(r3(max*i/4))}</span>`).join('')}</div><span></span></div></div>`:empty('Nenhum produto com estoque no momento.');
  const mk=(list,tipo)=>{const items=list.sort((a,b)=>b.date.localeCompare(a.date)||(b.ts||0)-(a.ts||0)).slice(0,6);
   return items.length?`<table><thead><tr><th>Data</th><th>${tipo==='Sêmen'?'Touro':'Produto'}</th><th>Fazenda</th><th>Movimentação</th><th class="num">Total</th></tr></thead><tbody>

  const lastS=mk([...S.movs],'Sêmen'),lastP=mk([...S.pmovs],'Produto');
  return `<div class="stats" style="grid-template-columns:repeat(2,1fr)">
    <div class="card stat"><div class="n">${fmt(S.tanks.length)}</div><div class="l">Botijões cadastrados</div></div>
    <div class="card stat"><div class="n">${fmt(doses)}</div><div class="l">Doses em estoque${touros?' · '+touros+(touros>1?' touros':' touro'):''}</div></div>
  </div>
  <div class="card stat ${lowT.length?'alert':''}"><div class="n">${fmt(lowT.length)} de ${fmt(S.tanks.length)}</div><div class="l">Botijões com nitrogênio baixo (abaixo de ${LOW} cm)${lowT.length?' · '+lowT.map(o=>esc(o.t.name)+' ('+o.l.level+' cm)').join(', '):''}</div>

  <div class="card"><div class="card-h"><h3>Estoque atual por produto</h3><span class="muted">Saldo de todas as fazendas</span></div>${chart}</div>

const LCAT=NCATS;
const LPAR=['Primíparas','Secundíparas','Multíparas'];
const ITIT={'i-painel':'Painel','i-lotes':'Agendar Lotes','i-fichas':'Fichas Serviços','i-ordens':'Ordens Serviços','i-estacao':'Controle da Estação'};

const pct=(a,b)=>b>0?(a/b*100).toLocaleString('pt-BR',{minimumFractionDigits:1,maximumFractionDigits:1})+'%':'—';
const sumL=(arr,k)=>arr.reduce((a,x)=>a+(x[k]||0),0);
const hasN=(arr,k)=>arr.some(x=>x[k]!==undefined);
function estTot(id){const a=S.lancs.filter(x=>x.est===id);
  const e=S.estacoes.find(x=>x.id===id)||{};
  return {n:a.length,mz:F(e.farm).matrices,diag:hasN(a,'diag')?sumL(a,'diag'):undefined,pren:hasN(a,'pren')?sumL(a,'pren'):undefined}}
function vEstacao(){
  if(ui.est.id&&S.estacoes.some(x=>x.id===ui.est.id))return vEstLanc();
  const list=[...S.estacoes].sort((a,b)=>b.start.localeCompare(a.start));
  const n=v=>v===undefined||v===null||v===''?'—':fmt(v);
  return `<div class="card"><div class="card-h"><h3>Controle da Estação</h3><button class="btn pri" data-a="newEst">Nova estação</button></div>
  <div class="tw">${list.length?`<table><thead><tr><th>Fazenda</th><th>Início EM</th><th>Final EM</th><th class="num">Matrizes</th><th class="num">Diagnósticos</th><th class="num">Prenhas</th><th class="num">Vazias</th><th class="num">Prenhez Geral</th><th>Ações</th></tr></thead><tbody>
  ${list.map(e=>{const t=estTot(e.id),l=t.diag!==undefined&&t.pren!==undefined;return `<tr><td><b>${esc(F(e.farm).name)}</b></td><td>${dt(e.start)}</td><td>${dt(e.end)}</td>
   <td class="num">${n(t.mz)}</td><td class="num">${n(t.diag)}</td><td class="num">${n(t.pren)}</td><td class="num">${l?fmt(t.diag-t.pren):'—'}</td><td class="num"><b>${t.pren!==undefined&&t.mz?pct(t.pren,t.mz):'—'}</b></td>
   <td><div class="acts"><button class="btn sm pri" data-a="lancEst" data-v="${e.id}">Lançar</button><button class="btn sm" data-a="editEst" data-v="${e.id}">Editar</button><button class="btn sm dng" data-a="delEst" data-v="${e.id}">Excluir</button></div></td></tr>`}).join('')}
  </tbody></table>`:empty('Nenhuma estação criada. Clique em Nova estação para começar.')}</div></div>`;
}
const lcalc=a=>{const d=hasN(a,'diag')&&hasN(a,'pren');
  return {impl:sumL(a,'impl'),ret:hasN(a,'ret')?sumL(a,'ret'):undefined,ins:hasN(a,'ins')?sumL(a,'ins'):undefined,diag:hasN(a,'diag')?sumL(a,'diag'):undefined,pren:hasN(a,'pren')?sumL(a,'pren'):undefined,
    vaz:d?sumL(a,'diag')-sumL(a,'pren'):undefined,conc:hasN(a,'pren')&&hasN(a,'ins')?pct(sumL(a,'pren'),sumL(a,'ins')):'—'}};
function vEstLanc(){
  const e=S.estacoes.find(x=>x.id===ui.est.id),tab=ui.est.tab;
  const all=S.lancs.filter(x=>x.est===e.id);
  const tabs=['1','2','3','G'].map(t=>`<button class="btn ${tab===t?'pri':''}" data-a="estTab" data-v="${t}">${t==='G'?'GERAL IATF':'IATF '+t}</button>`).join('');
  const head=`<div class="card"><div class="card-h"><div><button class="btn sm" data-a="backEst">← Estações</button></div></div>
   <h3 style="margin:0 0 4px">${esc(F(e.farm).name)}</h3><p class="muted" style="margin:0 0 12px">EM ${dt(e.start)} a ${dt(e.end)}${e.city?' · '+esc(e.city):''}</p>
   <div class="acts" style="margin-bottom:14px;flex-wrap:wrap">${tabs}</div>`;
  const n=v=>v===undefined?'—':fmt(v);
  const calc=lcalc;
  if(tab==='G'){
    const rows=[1,2,3].map(i=>({lbl:'IATF '+i,...calc(all.filter(x=>x.etapa===i))})),tot={lbl:'Total',...calc(all)};
    const mz=F(e.farm).matrices,prenhez=tot.pren!==undefined&&mz?pct(tot.pren,mz):'—';
    return head+`<div class="card-h" style="padding:0 0 10px"><h3>GERAL IATF</h3><button class="btn pri" data-a="printLanc">Imprimir</button></div><div class="tw"><table><thead><tr><th>Etapa</th><th class="num">Implantadas</th><th class="num">Retiradas</th><th class="num">Inseminadas</th><th class="num">Diagnósticos</th><th class="num">Prenhas</th><th class="num">Vazias</th><th class="num">Concepção</th></tr></thead><tbody>
    ${rows.map(r=>`<tr><td>${r.lbl}</td><td class="num">${fmt(r.impl)}</td><td class="num">${n(r.ret)}</td><td class="num">${n(r.ins)}</td><td class="num">${n(r.diag)}</td><td class="num">${n(r.pren)}</td><td class="num">${n(r.vaz)}</td><td class="num">${r.conc}</td></tr>`).join('')}
    </tbody><tfoot><tr><td>Total</td><td class="num">${fmt(tot.impl)}</td><td class="num">${n(tot.ret)}</td><td class="num">${n(tot.ins)}</td><td class="num">${n(tot.diag)}</td><td class="num">${n(tot.pren)}</td><td class="num">${n(tot.vaz)}</td><td class="num">${tot.conc}</td></tr></tfoot></table></div>
    <p class="muted" style="margin:12px 0 0;font-size:13px">Matrizes da fazenda: <b>${mz?fmt(mz):'—'}</b> (do cadastro da fazenda) · Prenhez geral: <b>${prenhez}</b> (prenhas ÷ matrizes).</p></div>`;
  }
  const list=all.filter(x=>String(x.etapa)===tab).sort((a,b)=>a.im.localeCompare(b.im));
  const c=calc(list);
  return head+`<div class="card-h" style="padding:0 0 10px"><h3>IATF ${tab}</h3><div class="acts"><button class="btn" data-a="printLanc">Imprimir</button><button class="btn pri" data-a="newLanc">Novo Lançamento IATF</button></div></div>
  <div class="tw cmp">${list.length?`<table><thead><tr><th>Lote</th><th>Data IM</th><th>Data RE</th><th>Data IA</th><th>Data DG</th><th>Categoria</th><th>Carimbo</th><th class="num">Implantadas</th><th class="num">Retiradas</th><th class="num">Inseminadas</th><th class="num">Diagnósticos</th><th class="num">Prenhas</th><th class="num">Vazias</th><th class="num">Concepção</th><th>Ações</th></tr></thead><tbody>
  ${list.map(l=>{const lt=S.lotes.find(x=>x.id===l.lote),vz=l.diag!==undefined&&l.pren!==undefined?l.diag-l.pren:undefined;
   return `<tr><td><b>${esc(lt?lt.name:'?')}</b></td><td>${dt(l.im)||'—'}</td><td>${dt(l.re)||'—'}</td><td>${dt(l.ia)||'—'}</td><td>${dt(l.dg)||'—'}</td><td>${esc(l.cat)}</td><td>${esc(l.carimbo||'—')}</td>
   <td class="num">${fmt(l.impl)}</td><td class="num">${n(l.ret)}</td><td class="num">${n(l.ins)}</td><td class="num">${n(l.diag)}</td><td class="num">${n(l.pren)}</td><td class="num">${n(vz)}</td><td class="num"><b>${l.pren!==undefined&&l.ins?pct(l.pren,l.ins):'—'}</b></td>
   <td><div class="acts"><button class="btn sm" data-a="editLanc" data-v="${l.id}">Editar</button><button class="btn sm dng" data-a="delLanc" data-v="${l.id}">Excluir</button></div></td></tr>`}).join('')}
  </tbody><tfoot><tr><td colspan="7">Total IATF ${tab}</td><td class="num">${fmt(c.impl)}</td><td class="num">${n(c.ret)}</td><td class="num">${n(c.ins)}</td><td class="num">${n(c.diag)}</td><td class="num">${n(c.pren)}</td><td class="num">${n(c.vaz)}</td><td class="num">${c.conc}</td><td></td></tr></tfoot></table>`:empty('Nenhum lançamento na IATF '+tab+'. Clique em Novo Lançamento IATF.')}</div></div>`;
}
